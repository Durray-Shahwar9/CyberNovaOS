const Q=[
["What is malware?","malware","Malware is any software built to harm, spy on or take control of a device. Viruses, worms, trojans, ransomware and spyware are all types."],

["How to back up files","backup|back up","Follow 3-2-1: three copies, two kinds of storage, one offline or offsite. An offline copy beats ransomware."],

const SC={Windows:"scan windows",Android:"scan android",iPhone:"check iphone",Mac:"scan mac"},IN={Windows:"windows defender",Android:"antivirus for android",iPhone:"iphone virus",Mac:"xprotect"};
//ENDDATA
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),norm=s=>s.toLowerCase().replace(/anti[-\s]virus/g,"antivirus").replace(/[’]/g,"'");
const sc=(kw,low)=>kw.split("|").filter(k=>low.includes(k)).reduce((n,k)=>n+k.length,0);
function findV(low){return V.filter(v=>{if(["brain","flame"].includes(v.id)&&!/virus|malware|worm|spyware|hack|cyber|computer|attack/.test(low))return false;const a=[v.name.toLowerCase()].concat(v.id=="storm"?[]:[v.id],{cih:["chernobyl"],kaseya:["revil"],sunburst:["solarwinds"]}[v.id]||[]);return a.some(x=>new RegExp("\\b"+esc(x)+"\\b").test(low))}).slice(0,2)}
let os="Windows";
const card=(t,b)=>`<div class="fact"><b>${t}</b><br>${b}</div>`,sCard=e=>card(e[2]+" (likely)",e[3]+`<ul class="pn">${e[4].split(";").map(x=>`<li>${x}</li>`).join("")}</ul>`);
function show(h){$("out").innerHTML=h;$("out").scrollIntoView()}
function tail(){return `<div class="btns"><button onclick="ask(SC[os])">Check my ${os}</button><button onclick="ask(IN[os])">Antivirus for ${os}</button></div><p class="hint">Symptoms do not prove an infection. Only a real scan can confirm it.</p>`}
function ask(raw){const low=norm(raw).trim();if(!low)return;$("tx").value=raw;
const vs=findV(low),qs=Q.map(e=>[sc(e[1],low),e]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,2),ss=S.map(e=>[sc(e[1],low),e]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,3);
let h=vs.map(v=>card(`${v.name} (${v.year}, ${v.type})`,`${v.history} <a href="virus.html?v=${v.id}">Open full page</a>`)).join("")+qs.map(x=>card(x[1][0],x[1][2])).join("")+ss.map(x=>sCard(x[1])).join("");
if(ss.length)h+=tail();if(!h)h=card("I do not have that yet","Try a virus name like WannaCry, a topic like ransomware or phishing, or tap a symptom below.");show(h)}
$("sub").textContent=`Describe a problem or ask a question. Nova knows ${S.length} symptoms, ${Q.length} questions and ${V.length} famous viruses. It gives likely causes, how to check, antivirus advice and prevention. It is a guide, not a diagnosis.`;
Object.keys(SC).forEach(o=>{const b=document.createElement("button");b.textContent=o;b.className=o==os?"on":"";b.onclick=()=>{os=o;[...$("os").children].forEach(k=>k.classList.toggle("on",k==b))};$("os").append(b)});
S.forEach(e=>{const b=document.createElement("button");b.textContent=e[0];b.onclick=()=>{$("tx").value=e[0];show(sCard(e)+tail())};$("ch").append(b)});
$("go").onclick=()=>ask($("tx").value);$("tx").onkeydown=e=>{if(e.key=="Enter")ask($("tx").value)};
</script></body></html>
