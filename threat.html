<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threat Helper | Cyber Nova OS</title><link rel="stylesheet" href="style.css">
<style>textarea{font:inherit;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:10px;width:100%;min-height:100px;margin:8px 0}.os{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.urg{border-color:var(--rd);background:#2a0e16}</style></head><body><main>
<h1>Threat Helper</h1><p class="hint">Tell Nova what is happening on your device. It matches your problem to likely threats, then shows how to check for a virus, how to install protection and how to clean up. It is a guide, not a diagnosis.</p>
<h2>1. Your device</h2><div class="os" id="os"></div>
<h2>2. What is happening?</h2><textarea id="tx" placeholder="Example: my laptop is very slow and pop-ups keep appearing"></textarea>
<div class="chips" id="ch"></div>
<div class="btns"><button id="go">Help me</button></div><div id="out"></div></main>
<script src="data.js"></script><script src="app.js"></script><script>
const $=id=>document.getElementById(id);
//LOGIC
const R=[
{k:/ransom|locked|encrypt|bitcoin|can'?t open (my )?(files|photos|documents)|\.locky|pay (to|us)/,n:"Possible ransomware",u:1,w:"Ransomware locks your files and demands payment. WannaCry and Locky worked this way.",s:["Disconnect from Wi-Fi and unplug the network cable now so it cannot spread.","Do not pay. Payment does not guarantee your files come back.","Do not delete the locked files, and take a photo of the ransom note.","Restore files from an offline backup after the device is cleaned.","Report it to your local cyber-crime authority or your IT team."]},
{k:/pop-?ups?|\bads?\b|advert|redirect|homepage|home page|search engine|toolbar/,n:"Adware or browser hijacker",w:"Unwanted software that pushes ads or changes your browser settings.",s:["Remove unknown browser extensions and recently installed apps.","Reset your browser settings to default.","Never tap Allow notifications on unknown websites."]},
{k:/slow|lag|\bfan\b|hot|overheat|battery|freez|hang/,n:"Slowdown: malware, or just too many programs",w:"Cryptominers and bots use your processor, but slow devices are often just full storage or too many startup apps.",s:["Check which app uses the most CPU or battery and remove anything you do not recognise.","Restart the device and free up storage space."]},
{k:/camera|webcam|microphone|\bmic\b|spying|spy|watching|listening|stalk/,n:"Possible spyware",w:"Spyware can record audio, video or your screen without you noticing.",s:["Check which apps have camera and microphone permission and remove ones you do not trust.","Update your operating system and all apps.","If you fear someone is stalking you, use a different trusted device to change passwords."]},
{k:/password|account|login|log in|logged in|hacked|otp|bank|facebook|instagram|gmail|snapchat/,n:"Possible stolen account or password",w:"Info-stealing malware or phishing can take passwords.",s:["Change passwords from a clean device, starting with email and banking.","Turn on two-factor login.","Sign out of all devices in each account's security settings."]},
{k:/(antivirus|defender|security|firewall).*(off|disabled|turned off|won'?t (open|start))|can'?t (open|install) (an )?antivirus|task manager.*(disabled|won'?t)/,n:"Malware switching off your defences",w:"Some malware disables security tools so it can hide.",s:["Restart in Safe Mode (Windows) or Safe mode (Android) and run a full scan.","Turn security protection back on and update it."]},
{k:/friends|contacts|followers|strange (messages?|emails?)|messages? (were )?sent|spam/,n:"Hijacked account or messaging worm",w:"Email worms like ILOVEYOU and Melissa spread by messaging your contacts.",s:["Warn your contacts not to open anything from you.","Change the account password and sign out of all devices."]},
{k:/unknown (app|program|software)|new (app|program)|don'?t (remember|recognise|recognize)|installed (by|on its own)|did not install/,n:"Unwanted software or trojan",w:"Trojans pretend to be useful apps and then do harm.",s:["Uninstall anything you do not recognise, starting with the newest.","Install apps only from official stores."]},
{k:/data usage|mobile data|wifi|wi-fi|router/,n:"Botnet or network problem",w:"Infected devices can use your connection in the background, as in the Mirai botnet.",s:["Check which apps use the most data.","Change your router's admin password and update its firmware."]},
{k:/crash|blue screen|bsod|reboot|shut ?down|restart/,n:"Crashes: malware or a technical fault",w:"Crashes can be malware like Sasser, but are often driver or hardware faults.",s:["Install system updates and run a full scan.","If crashes continue after a clean scan, suspect hardware or drivers."]}];
const match=t=>R.filter(r=>r.k.test(t.toLowerCase()));
//ENDLOGIC
const CHK={Windows:["Open Settings, then Privacy & security, then Windows Security, then Virus & threat protection.","Tap Quick scan. Then open Scan options, choose Full scan and start it.","In Scan options also run Microsoft Defender Offline scan to catch hidden malware.","Press Ctrl+Shift+Esc to open Task Manager and look for unknown programs using lots of CPU.","Open Settings, then Apps, and uninstall programs you do not recognise."],
Android:["Open the Play Store, tap your profile picture, then Play Protect, then Scan.","Open Settings, then Apps, and look for apps you did not install.","Check Settings, then Security, then Device admin apps. Unknown apps should not be listed.","If an app will not uninstall, restart in Safe mode and remove it there."],
iPhone:["Update iOS in Settings, then General, then Software Update.","Open Settings, then General, then VPN & Device Management and remove profiles you do not recognise.","Delete apps you do not recognise and clear Safari history and website data in Settings, then Safari.","iPhones rarely get classic viruses. Most problems are scams, bad profiles or stolen passwords."],
Mac:["Update macOS in System Settings, then General, then Software Update.","Open Applications and delete apps you do not recognise.","Check System Settings, then General, then Login Items and remove unknown ones.","Run a scan with a trusted tool such as Malwarebytes, downloaded from its official site."]};
const INS={Windows:["Windows already has Microsoft Defender built in. Make sure it is on in Windows Security.","For a second opinion, download Malwarebytes only from its official website.","Never download antivirus from pop-up ads or email links. Fake ones are common."],
Android:["Google Play Protect is built in. Make sure it is on in the Play Store settings.","If you want an extra app, install a well-known one only from the Play Store.","Ignore apps that say your phone has viruses. Those are scams."],
iPhone:["iPhones do not need antivirus apps, and iOS apps cannot scan other apps.","Avoid any app that claims to remove iPhone viruses. They are usually scams.","Keep iOS updated and use a strong passcode."],
Mac:["macOS has built-in malware protection called XProtect. Keep it updated through Software Update.","For extra scanning, use a trusted tool like Malwarebytes from the official website.","Avoid fake Mac cleaner pop-ups."]};
const AFTER=["Change passwords from a clean device and turn on two-factor login.","Update the operating system and all apps.","Restore files only from a backup made before the problem started.","If the problem returns, back up your files and factory reset the device."];
const CH=["My files are locked or there is a ransom note","Pop-ups and ads keep appearing","My device is very slow and hot","Browser homepage changed by itself","Camera light turns on by itself","Antivirus is turned off","Friends got strange messages from me","I see apps I did not install","Accounts show unknown logins"];
let os="Windows";
const ul=a=>`<ul class="pn">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
Object.keys(CHK).forEach(o=>{const b=document.createElement("button");b.textContent=o;b.className=o==os?"on":"";b.onclick=()=>{os=o;[...$("os").children].forEach(k=>k.classList.toggle("on",k==b))};$("os").append(b)});
CH.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>{$("tx").value=($("tx").value+" "+c+".").trim()};$("ch").append(b)});
$("go").onclick=()=>{const t=$("tx").value.trim();if(!t){$("out").innerHTML="<p class='hint'>Describe the problem or tap a symptom above first.</p>";return}
const m=match(t);let h="";
if(m.length){if(m.some(x=>x.u))h+=`<div class="fact urg"><b class="warn">Urgent:</b> this may be ransomware. Disconnect from the internet first, then follow the steps below.</div>`;
h+="<h2>What this might be</h2>"+m.map(x=>`<div class="fact"><b>${x.n}</b><br>${x.w}</div>`).join("")+"<h2>Do this now</h2>"+ul([...new Set(m.flatMap(x=>x.s))])}
else h+=`<div class="fact">I could not match that to a known symptom. Use the general checks below, or tap a symptom above.</div>`;
h+=`<h2>How to check your ${os} device</h2>${ul(CHK[os])}<h2>Antivirus on ${os}</h2>${ul(INS[os])}<h2>After cleaning</h2>${ul(AFTER)}<p class="hint">Symptoms do not prove an infection. If money, work data or personal safety is involved, ask an IT professional.</p>`;
$("out").innerHTML=h;$("out").scrollIntoView()};
</script></body></html>
